services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: crm_business
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - crm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d crm_business']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  crm_postgres:
