name: CRM quality gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: crm_business_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm -d crm_business_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://crm:ci-disposable-password@localhost:5432/crm_business_test
      TEST_DATABASE_URL: postgresql+psycopg://crm:ci-disposable-password@localhost:5432/crm_business_test
      JWT_SECRET: ci-only-nonproduction-signing-secret-at-least-32-chars
      APP_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run check
      - run: ruff check backend migrations scripts
      - run: pytest -q
      - run: alembic current
      - run: alembic check
      - run: python scripts/build.py
      - run: pip check
      - run: npm audit --audit-level=high
      - run: pip-audit -r requirements.txt --progress-spinner off
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
