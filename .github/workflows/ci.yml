name: CRM quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: crm_business_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm -d crm_business_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://crm:ci-disposable-password@localhost:5432/crm_business_test
      TEST_DATABASE_URL: postgresql+psycopg://crm:ci-disposable-password@localhost:5432/crm_business_test
      JWT_SECRET: ci-only-nonproduction-signing-secret-at-least-32-chars
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run check
      - run: ruff check backend migrations scripts/build.py
      - run: pytest -q
      - run: alembic current
      - run: alembic check
      - run: python scripts/build.py
      - run: pip check
