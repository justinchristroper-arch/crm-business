[project]
name = "crm-business"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.0.54",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "argon2-cffi==25.1.0",
  "PyJWT==2.15.1",
  "pydantic-settings==2.15.0",
  "email-validator==2.3.0",
  "tzdata==2026.5",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "python scripts/build.py"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
